# Builds AutoKRP.exe on Windows in GitHub Actions (optional cross-check of the local build).
# Official releases are built locally with build.bat and published by the maintainer, so this workflow
# runs only when started by hand from the Actions tab (a tag push does not trigger it, to avoid a second exe
# being attached to the same release). When started for a tag, the result is attached to a draft release.
name: release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Dependency list for the in-app security check
        run: python dev/deps_snapshot.py
      - name: Build exe
        shell: cmd
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name AutoKRP --icon assets\app.ico
          --add-data "ui;ui" --add-data "assets\app.png;assets" --add-data "assets\mibs;assets\mibs"
          --add-data "autokrp\trapdb.json;autokrp" --add-data "autokrp\oui.dat;autokrp" --add-data "autokrp\build_deps.txt;autokrp" --collect-submodules serial --hidden-import pystray._win32 --hidden-import pymysql
          --hidden-import autokrp.fgtask_child --hidden-import autokrp.snmpworker --hidden-import autokrp.snmppool --hidden-import autokrp.tsdb --hidden-import autokrp.icmp --collect-submodules netmiko --collect-submodules dns
          --collect-submodules pysnmp --collect-submodules ldap3 --collect-all pysmi --collect-data lark
          --hidden-import sqlcipher3 --collect-binaries sqlcipher3 app.py
      - name: Smoke test
        shell: pwsh
        run: |
          if (!(Test-Path dist\AutoKRP.exe)) { throw "exe missing" }
      - name: Checksum and dependency list
        shell: pwsh
        run: |
          (Get-FileHash dist\AutoKRP.exe -Algorithm SHA256).Hash + "  AutoKRP.exe" | Out-File -Encoding ascii dist\AutoKRP.exe.sha256.txt
          python -m pip freeze | Out-File -Encoding utf8 dist\AutoKRP-build-requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AutoKRP-windows
          path: |
            dist/AutoKRP.exe
            dist/AutoKRP.exe.sha256.txt
            dist/AutoKRP-build-requirements.txt
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AutoKRP.exe
            dist/AutoKRP.exe.sha256.txt
            dist/AutoKRP-build-requirements.txt
          draft: true
