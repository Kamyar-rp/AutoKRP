# Automatic security checks on every push and pull request: syntax, Bandit (Medium/High) and pip-audit
name: security
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly, for newly published dependency vulnerabilities
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install bandit pip-audit
      - name: Syntax
        run: python -m compileall -q app.py autokrp
      - name: Bandit (Medium/High)
        run: python -m bandit -r app.py autokrp -ll
      - name: pip-audit
        # GHSA-r374-rxx8-8654 (paramiko SHA-1): no fixed release; SHA-1 is off except for devices marked legacy
        run: python -m pip_audit -r requirements.txt --ignore-vuln GHSA-r374-rxx8-8654
