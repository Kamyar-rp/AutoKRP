name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your workflow and what is missing or slow today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should it work? Which tool / page / device is involved?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else (API docs, examples, screenshots)?
